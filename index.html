<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Flow</title>

  <!-- CSS 파일 연결 -->
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">✓</div>
      <div>
        <h1>STUDY FLOW</h1>
        <p>오늘의 집중을 차곡차곡</p>
      </div>
    </div>

    <button class="icon-button" id="settingsButton" type="button" aria-label="타이머 설정 열기">
      ⚙
    </button>
  </header>

  <section class="dashboard">
    <div class="timer-card" id="timerCard">
      <div class="mode-tabs" role="tablist" aria-label="타이머 모드">
        <button class="mode-tab active" data-mode="focus" type="button">
          집중
        </button>
        <button class="mode-tab" data-mode="short" type="button">
          짧은 휴식
        </button>
        <button class="mode-tab" data-mode="long" type="button">
          긴 휴식
        </button>
      </div>

      <div class="subject-area">
        <label for="subjectInput">지금 공부할 과목</label>
        <input
          id="subjectInput"
          type="text"
          maxlength="24"
          placeholder="예: 수학 문제집 20쪽"
          autocomplete="off"
        />
      </div>

      <div class="timer-visual">
        <svg class="progress-ring" viewBox="0 0 280 280" aria-hidden="true">
          <circle class="ring-background" cx="140" cy="140" r="124"></circle>
          <circle class="ring-progress" id="progressRing" cx="140" cy="140" r="124"></circle>
        </svg>

        <div class="timer-content">
          <span class="status-label" id="statusLabel">집중할 시간</span>
          <time id="timerDisplay">25:00</time>
          <span class="subject-preview" id="subjectPreview">과목을 입력해 보세요</span>
        </div>
      </div>

      <div class="timer-controls">
        <button class="secondary-button" id="resetButton" type="button">
          ↺ <span>초기화</span>
        </button>

        <button class="primary-button" id="startButton" type="button">
          <span id="startIcon">▶</span>
          <span id="startText">시작</span>
        </button>

        <button class="secondary-button" id="skipButton" type="button">
          <span>건너뛰기</span> →
        </button>
      </div>

      <p class="shortcut-guide">스페이스바로 시작하거나 잠시 멈출 수 있어요.</p>
    </div>

    <aside class="side-panel">
      <section class="stat-card">
        <div class="section-heading">
          <div>
            <span class="eyebrow">TODAY</span>
            <h2>오늘의 집중</h2>
          </div>
          <button class="text-button" id="clearSessionsButton" type="button">
            기록 초기화
          </button>
        </div>

        <div class="session-stat">
          <strong id="completedCount">0</strong>
          <span>세션 완료</span>
        </div>

        <div class="tomato-row" id="sessionDots" aria-label="완료한 집중 세션">
          <span class="session-dot"></span>
          <span class="session-dot"></span>
          <span class="session-dot"></span>
          <span class="session-dot"></span>
        </div>

        <div class="progress-info">
          <span>오늘의 목표</span>
          <strong><span id="goalProgress">0</span> / <span id="goalValue">8</span></strong>
        </div>

        <div class="goal-bar">
          <div id="goalBarFill"></div>
        </div>
      </section>

      <section class="tip-card">
        <span class="tip-icon">💡</span>
        <div>
          <h2>집중 팁</h2>
          <p id="focusTip">
            시작하기 전에 휴대폰을 뒤집어 두고, 이번 세션의 목표를 하나만 정해 보세요.
          </p>
        </div>
      </section>
    </aside>
  </section>
</main>

<div class="modal-backdrop" id="settingsModal" hidden>
  <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <div>
        <span class="eyebrow">CUSTOMIZE</span>
        <h2 id="settingsTitle">타이머 설정</h2>
      </div>
      <button class="close-button" id="closeSettingsButton" type="button" aria-label="설정 닫기">
        ×
      </button>
    </div>

    <div class="setting-grid">
      <label>
        <span>집중 시간</span>
        <div class="number-input">
          <input id="focusMinutes" type="number" min="1" max="90" value="25" />
          <span>분</span>
        </div>
      </label>

      <label>
        <span>짧은 휴식</span>
        <div class="number-input">
          <input id="shortMinutes" type="number" min="1" max="30" value="5" />
          <span>분</span>
        </div>
      </label>

      <label>
        <span>긴 휴식</span>
        <div class="number-input">
          <input id="longMinutes" type="number" min="1" max="60" value="15" />
          <span>분</span>
        </div>
      </label>

      <label>
        <span>하루 목표</span>
        <div class="number-input">
          <input id="dailyGoal" type="number" min="1" max="20" value="8" />
          <span>회</span>
        </div>
      </label>
    </div>

    <div class="toggle-list">
      <label class="toggle-row">
        <div>
          <strong>다음 타이머 자동 시작</strong>
          <span>집중과 휴식이 자동으로 이어집니다.</span>
        </div>
        <input id="autoStartToggle" type="checkbox" />
        <span class="toggle"></span>
      </label>

      <label class="toggle-row">
        <div>
          <strong>완료 알림음</strong>
          <span>타이머가 끝나면 소리로 알려줍니다.</span>
        </div>
        <input id="soundToggle" type="checkbox" checked />
        <span class="toggle"></span>
      </label>
    </div>

    <button class="save-button" id="saveSettingsButton" type="button">
      설정 저장
    </button>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
  <main class="app">
    ...
  </main>

  <!-- 설정창과 알림창까지 HTML 코드 전체를 넣은 뒤 -->

  <!-- JavaScript 파일 연결: body 맨 마지막 -->
  <script src="./script.js"></script>
</body>
</html>
